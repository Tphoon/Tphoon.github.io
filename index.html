<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --text: #1d2733;
      --muted: #5b6876;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12181f;
        --text: #e8edf2;
        --muted: #9aa7b4;
        --accent: #6ea0ff;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    h1 {
      font-size: clamp(2.5rem, 10vw, 5rem);
      margin: 0 0 .5rem;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      font-size: 1.15rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello World!</h1>
    <p>Meine erste Seite auf GitHub Pages.</p>
  </main>
</body>
</html>
